name: Build root-patched APK

# [PATCH-ROOT] Builds a debug APK of OpenMinis with the android-root-cli
# backend added. Manual dispatch only: this fork exists solely to produce that
# artefact, and a push trigger would rebuild the native stack on every
# documentation edit.
#
# ── What the Android build actually needs ────────────────────────────────────
# BUILDING.md's Android section and this workflow list the SAME three native
# prerequisites, and that is not a coincidence — anything else is iOS-only:
#
#   PRoot          required. scripts/prepare_android_sandbox.sh refuses to run
#                  without assets/proot-aarch64, and without it every execve
#                  inside the sandbox fails at runtime.
#   Alpine rootfs  required, downloaded by that same script.
#   rclone aar     required by build.gradle.kts (`implementation(group = "",
#                  name = "rclone", ext = "aar")`).
#
#   FFmpeg, LAME   NOT used on Android. build_lame.sh and build_ffmpeg.sh are
#                  macOS/Xcode scripts (`xcrun`, `-miphoneos-version-min`,
#                  `--host=aarch64-apple-darwin`), src/android/app/src/main/cpp
#                  builds only pty_bridge / crash_handler / jieba_jni, and
#                  nothing in the Gradle files references either library.
#                  Running them on a Linux runner fails instantly on `xcrun`.
on:
  workflow_dispatch:
    inputs:
      skip_native:
        description: "Skip rclone — build is much faster, but backup destinations (SMB/WebDAV/SFTP/S3/FTP) and the network panel will not work"
        type: boolean
        default: false

env:
  GO_VERSION: "1.25.1"
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  NDK_VERSION: "28.0.12433566"
  # Pinned: Google rotates `_latest` and an unpinned zip can change its internal
  # directory layout (the `cmdline-tools/` wrapper) without notice.
  CMDLINE_TOOLS: "13114758"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # deps/proot is a submodule and build_proot.sh compiles straight out
          # of it. deps/ish is iOS-only but harmless to fetch.
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        # The runner ships ~14 GB free; NDK alone is ~4 GB. The preinstalled
        # Android SDK is removed here and reinstalled cleanly below, because the
        # image's cmdline-tools build is too old for current package lists.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Android SDK command-line tools
        # NOT android-actions/setup-android. That action runs `sdkmanager tools`
        # unconditionally, and the `tools` package was removed from the
        # repository — it dies with "Failed to find package 'tools'" before any
        # of our steps run. Installing the official zip is a few lines and
        # removes the dependency.
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS}_latest.zip"
          unzip -q cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${NDK_VERSION}"
          } >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install NDK + platform + build-tools
        # --licenses is fed `yes` and its exit status is deliberately ignored: it
        # returns non-zero on the empty trailing read even when every licence was
        # accepted. The install below is the real check.
        run: |
          set -euo pipefail
          SDKMAN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" --install \
            "ndk;${NDK_VERSION}" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"
          ls "$ANDROID_SDK_ROOT/ndk/"

      - name: Build PRoot (native sandbox runtime)
        # Produces assets/proot-aarch64 + jniLibs/arm64-v8a/libproot*.so.
        # NOT skippable — the comment at the top of this file explains why.
        run: |
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh

      - name: Build rclone aar (gomobile)
        if: ${{ !inputs.skip_native }}
        # build.gradle.kts declares a file dependency on app/libs/rclone.aar, so
        # a build with this skipped fails at dependency resolution unless the
        # declaration is also removed. The comment on the Gradle line points
        # here, so that is the intended escape hatch — but it means skip_native
        # is a "I know what I am doing" switch, not a convenience toggle.
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          chmod +x deps/build_rclone_android.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Prepare Android sandbox (Alpine rootfs + PRoot check)
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Apply the root-backend patch
        # The in-place EDITS that a file-upload cannot express: MinisApp.kt
        # registration, the settings-screen card, and the permission registry.
        run: python3 patch/apply_patch.py

      - name: Verify the patch landed
        run: python3 patch/verify_patch.py

      - name: Gradle build
        working-directory: src/android
        env:
          # Gradle's default 1.5 GB heap is far too small for this project; the
          # Kotlin daemon OOMs on the bigger Compose modules.
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Collect artefacts
        if: always()
        run: |
          mkdir -p out
          find src/android/app/build/outputs -name '*.apk' -exec cp {} out/ \; || true
          ls -la out/ || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openminis-root-patched-debug
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src/android/app/build/reports/**
            src/android/build/reports/**
          if-no-files-found: warn
          retention-days: 7